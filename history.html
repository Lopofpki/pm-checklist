<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประวัติ Daily Report | TNC</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --navy:#20364d;
    --blue:#2878bd;
    --green:#219653;
    --bg:#f3f6fa;
    --line:#dce3eb;
    --text:#243447;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    padding:18px;
    background:var(--bg);
    font-family:Arial,"Noto Sans Thai",sans-serif;
    color:var(--text);
}

.wrap {
    max-width:1600px;
    margin:auto;
}

.header,.panel {
    background:#fff;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 14px #20364d12;
    margin-bottom:15px;
}

h1 {
    font-size:22px;
    margin:0 0 5px;
    color:var(--navy);
}

.sub {
    font-size:14px;
    color:#667788;
}

.tools {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
    align-items:end;
}

.field {
    display:flex;
    flex-direction:column;
    gap:5px;
    font-size:13px;
    font-weight:600;
    min-width:160px;
    flex:1;
}

input {
    font:inherit;
    padding:9px;
    border:1px solid #cbd5df;
    border-radius:6px;
    width:100%;
    min-width:0;
}

.btn {
    border:0;
    border-radius:7px;
    padding:10px 15px;
    color:white;
    font-weight:700;
    cursor:pointer;
    background:var(--blue);
}

.btn:hover {
    opacity:.9;
}

.green {
    background:var(--green);
}

.gray {
    background:#64748b;
}

.stats {
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin:14px 0;
}

.stat {
    background:#eef5fb;
    padding:10px 14px;
    border-radius:8px;
    font-size:14px;
}

.stat b {
    font-size:18px;
    color:var(--navy);
    margin-left:5px;
}

.table-wrap {
    overflow:auto;
    background:white;
    border-radius:12px;
    box-shadow:0 3px 14px #20364d12;
}

table {
    border-collapse:collapse;
    width:100%;
    min-width:1450px;
}

th,td {
    border:1px solid var(--line);
    padding:8px;
    text-align:center;
    font-size:12px;
    white-space:nowrap;
}

th {
    background:var(--navy);
    color:white;
    position:sticky;
    top:0;
    z-index:2;
}

tbody tr:nth-child(even) {
    background:#f8fafc;
}

.done {
    color:#168044;
    font-weight:bold;
}

.pending {
    color:#b7791f;
    font-weight:bold;
}

.empty {
    text-align:center;
    padding:30px;
    color:#718096;
}

.loading {
    text-align:center;
    padding:30px;
    color:#2878bd;
}

.error {
    background:#fff0f0;
    border:1px solid #f3b5b5;
    color:#b42318;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
    font-size:13px;
    display:none;
}

@media(max-width:700px) {
    body {
        padding:10px;
    }

    h1 {
        font-size:18px;
    }

    .header,.panel {
        padding:13px;
    }

    .tools .btn {
        flex:1;
    }
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">

    <h1>ประวัติ Die Maintenance Daily Report</h1>

    <div class="sub">
        TNC · ระบบประวัติ Daily Report ผ่าน Supabase
    </div>

    <div class="tools">

        <label class="field">
            ค้นหาข้อมูล
            <input
                id="search"
                type="search"
                placeholder="ลูกค้า / Part No. / ผู้ซ่อม / รายละเอียด"
            >
        </label>

        <label class="field">
            วันที่เริ่ม
            <input id="fromDate" type="date">
        </label>

        <label class="field">
            ถึงวันที่
            <input id="toDate" type="date">
        </label>

        <button class="btn" id="filterBtn" type="button">
            ค้นหา
        </button>

        <button class="btn gray" id="resetBtn" type="button">
            ล้างตัวกรอง
        </button>

    </div>

    <div id="errorBox" class="error"></div>

</header>


<section class="panel">

    <div class="stats">

        <div class="stat">
            รายการที่แสดง
            <b id="count">0</b>
        </div>

        <div class="stat">
            เสร็จแล้ว
            <b id="doneCount">0</b>
        </div>

        <div class="stat">
            ยังไม่เสร็จ
            <b id="pendingCount">0</b>
        </div>

    </div>

    <div class="tools">

        <button class="btn green" id="exportBtn" type="button">
            ⬇ ส่งออก CSV
        </button>

        <button class="btn" id="backBtn" type="button">
            ＋ กลับไปหน้าบันทึก
        </button>

        <button class="btn gray" id="refreshBtn" type="button">
            ↻ โหลดข้อมูลใหม่
        </button>

    </div>

</section>


<div class="table-wrap">

<table>

<thead>
<tr>
    <th>#</th>
    <th>วันที่</th>
    <th>ลูกค้า</th>
    <th>Part No.</th>
    <th>Process</th>
    <th>สาเหตุการซ่อม</th>
    <th>สาเหตุปัญหา</th>
    <th>รายละเอียดการซ่อม</th>
    <th>ผู้ซ่อม</th>
    <th>เวลาเริ่ม</th>
    <th>เวลาเสร็จ</th>
    <th>รวมเวลา</th>
    <th>สถานะ</th>
    <th>หมายเหตุ</th>
</tr>
</thead>

<tbody id="historyBody">

<tr>
    <td colspan="14" class="loading">
        กำลังโหลดข้อมูลจาก Supabase...
    </td>
</tr>

</tbody>

</table>

</div>

</div>


<script>
"use strict";

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
"https://enmzfxdswzhatvcenrds.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_DkoWB0IDDgodellT5vgcLQ_YdqIhKdI";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================
   ELEMENTS
===================================== */

const body = document.getElementById("historyBody");

let allRecords = [];
let visibleRecords = [];


/* =====================================
   ERROR MESSAGE
===================================== */

function showError(message) {

    const box = document.getElementById("errorBox");

    box.style.display = "block";
    box.textContent = message;

}

function hideError() {

    const box = document.getElementById("errorBox");

    box.style.display = "none";
    box.textContent = "";

}


/* =====================================
   SAFE TEXT
===================================== */

function safe(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        })[char]
    );

}


/* =====================================
   DATE CONVERSION
===================================== */

// รองรับทั้ง YYYY-MM-DD และ DD/MM/YY
function normalizeDate(value) {

    if (!value) return "";

    const str = String(value).trim();

    // YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
        return str;
    }

    // DD/MM/YY หรือ DD/MM/YYYY
    const match = str.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/
    );

    if (match) {

        let day = Number(match[1]);
        let month = Number(match[2]);
        let year = Number(match[3]);

        if (year < 100) {
            year += 2000;
        }

        return [
            year,
            String(month).padStart(2,"0"),
            String(day).padStart(2,"0")
        ].join("-");

    }

    return "";

}


function displayDate(value) {

    if (!value) return "";

    const str = String(value);

    // ถ้าเป็น DD/MM/YY อยู่แล้วให้แสดงเหมือนเดิม
    if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(str)) {
        return str;
    }

    // YYYY-MM-DD แสดงเป็น DD/MM/YY
    const date = normalizeDate(str);

    if (!date) return str;

    const parts = date.split("-");

    return `${parts[2]}/${parts[1]}/${parts[0].slice(-2)}`;

}


/* =====================================
   LOAD DATA FROM SUPABASE
===================================== */

async function loadHistory() {

    hideError();

    body.innerHTML = `
        <tr>
            <td colspan="14" class="loading">
                กำลังโหลดข้อมูลจาก Supabase...
            </td>
        </tr>
    `;

    try {

        const { data, error } = await supabaseClient
            .from("daily_reports")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (error) {
            throw error;
        }

        allRecords = Array.isArray(data) ? data : [];

        render();

    } catch (error) {

        console.error("Supabase Error:", error);

        allRecords = [];
        visibleRecords = [];

        updateStats();

        body.innerHTML = `
            <tr>
                <td colspan="14" class="empty">
                    โหลดข้อมูลไม่สำเร็จ
                </td>
            </tr>
        `;

        showError(
            "โหลดข้อมูลจาก Supabase ไม่สำเร็จ: " +
            (error.message || "Unknown error")
        );

    }

}


/* =====================================
   FILTER AND RENDER
===================================== */

function render() {

    const q = document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;

    visibleRecords = allRecords.filter(record => {

        const haystack = [

            record.customer,
            record.part_no,
            record.process,
            record.cause_repair,
            record.cause_problem,
            record.repair_detail,
            record.repaired_by,
            record.remarks

        ].join(" ").toLowerCase();

        const date = normalizeDate(record.report_date);

        const matchSearch =
            !q || haystack.includes(q);

        const matchFrom =
            !from || (date && date >= from);

        const matchTo =
            !to || (date && date <= to);

        return matchSearch && matchFrom && matchTo;

    });

    updateStats();

    if (!visibleRecords.length) {

        body.innerHTML = `
            <tr>
                <td colspan="14" class="empty">
                    ไม่พบข้อมูลประวัติ
                </td>
            </tr>
        `;

        return;

    }

    body.innerHTML = visibleRecords.map((record,index) => `

        <tr>

            <td>${index + 1}</td>

            <td>${safe(displayDate(record.report_date))}</td>

            <td>${safe(record.customer)}</td>

            <td>${safe(record.part_no)}</td>

            <td>${safe(record.process)}</td>

            <td>${safe(record.cause_repair)}</td>

            <td>${safe(record.cause_problem)}</td>

            <td>${safe(record.repair_detail)}</td>

            <td>${safe(record.repaired_by)}</td>

            <td>${safe(record.start_time)}</td>

            <td>${safe(record.end_time)}</td>

            <td>${safe(record.work_duration)}</td>

            <td class="${record.status_done ? "done" : "pending"}">
                ${record.status_done ? "เสร็จแล้ว" : "ยังไม่เสร็จ"}
            </td>

            <td>${safe(record.remarks)}</td>

        </tr>

    `).join("");

}


/* =====================================
   UPDATE STATISTICS
===================================== */

function updateStats() {

    document.getElementById("count").textContent =
        visibleRecords.length;

    document.getElementById("doneCount").textContent =
        visibleRecords.filter(record => record.status_done === true).length;

    document.getElementById("pendingCount").textContent =
        visibleRecords.filter(record => record.status_done !== true).length;

}


/* =====================================
   RESET FILTER
===================================== */

document.getElementById("resetBtn").addEventListener("click", () => {

    document.getElementById("search").value = "";
    document.getElementById("fromDate").value = "";
    document.getElementById("toDate").value = "";

    render();

});


/* =====================================
   SEARCH
===================================== */

document.getElementById("filterBtn").addEventListener(
    "click",
    render
);

document.getElementById("search").addEventListener(
    "input",
    render
);


/* =====================================
   BACK TO DAILY REPORT
===================================== */

document.getElementById("backBtn").addEventListener("click", () => {

    location.href = "daily-report.html";

});


/* =====================================
   REFRESH DATA
===================================== */

document.getElementById("refreshBtn").addEventListener(
    "click",
    loadHistory
);


/* =====================================
   EXPORT CSV
===================================== */

function csvCell(value) {

    return '"' +
        String(value ?? "").replace(/"/g,'""') +
        '"';

}


document.getElementById("exportBtn").addEventListener("click", () => {

    if (!visibleRecords.length) {

        alert("ไม่มีข้อมูลสำหรับส่งออก");

        return;

    }

    const headers = [

        "วันที่",
        "ลูกค้า",
        "Part No.",
        "Process",
        "สาเหตุการซ่อม",
        "สาเหตุปัญหา",
        "รายละเอียดการซ่อม",
        "ผู้ซ่อม",
        "เวลาเริ่ม",
        "เวลาเสร็จ",
        "รวมเวลา",
        "สถานะ",
        "หมายเหตุ"

    ];

    const keys = [

        "report_date",
        "customer",
        "part_no",
        "process",
        "cause_repair",
        "cause_problem",
        "repair_detail",
        "repaired_by",
        "start_time",
        "end_time",
        "work_duration",
        "status_done",
        "remarks"

    ];

    const rows = [

        headers,

        ...visibleRecords.map(record => {

            return keys.map(key => {

                if (key === "status_done") {
                    return record.status_done
                        ? "เสร็จแล้ว"
                        : "ยังไม่เสร็จ";
                }

                if (key === "report_date") {
                    return displayDate(record.report_date);
                }

                return record[key] ?? "";

            });

        })

    ];

    const csv =
        "\uFEFF" +
        rows.map(row =>
            row.map(csvCell).join(",")
        ).join("\r\n");

    const blob = new Blob(
        [csv],
        { type:"text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download =
        `TNC_Daily_Report_${new Date().toISOString().slice(0,10)}.csv`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

});


/* =====================================
   START
===================================== */

loadHistory();

</script>

</body>
</html>

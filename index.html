<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die PM Check List - เมนูหลัก</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #1e40af, #3b82f6); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 16px; padding: 40px 30px; max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; }
        .logo { font-size: 3rem; margin-bottom: 10px; }
        h1 { font-size: 1.4rem; color: #1e3a8a; margin-bottom: 5px; }
        p { color: #64748b; font-size: 0.95rem; margin-bottom: 35px; }
        .menu-btn { display: block; text-decoration: none; padding: 16px 20px; border-radius: 10px; font-size: 1rem; font-weight: 600; margin-bottom: 14px; transition: all 0.2s; }
        .btn-scan { background: #dbeafe; color: #1e40af; }
        .btn-scan:hover { background: #bfdbfe; transform: translateY(-2px); }
        .btn-form { background: #dcfce7; color: #166534; }
        .btn-form:hover { background: #bbf7d0; transform: translateY(-2px); }
        .btn-history { background: #fef3c7; color: #92400e; }
        .btn-history:hover { background: #fde68a; transform: translateY(-2px); }
        .footer { margin-top: 25px; font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📋</div>
        <h1>Die PM Check List</h1>
        <p>Thai Nippon Components Co., Ltd.</p>

        <a href="scan.html" class="menu-btn btn-scan">📷 สแกน QR Code</a>
        <a href="history.html" class="menu-btn btn-history">📂 ประวัติข้อมูล</a>

        <div class="footer">ระบบบันทึกข้อมูลทำงานบนเครื่องคอมพิวเตอร์/มือถือของคุณ</div>
    </div>
</body>
</html>
